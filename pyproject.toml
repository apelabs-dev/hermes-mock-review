# Dependency declaration for Hermes's plugin installer (it reads [project] dependencies and requires-python).
# Not a packaging setup: the plugin is installed as a directory, not built or published.
[project]
name = "mock-review"
version = "2.2.0" # x-release-please-version
description = "Review boards for UI mockups that wake Hermes when the reviewer presses Send."
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
# Cloudflare Access sign-in (cloudflare_team / cloudflare_audience) verifies RS256 JWTs.
crypto = [
    # A range, not a pin: Hermes 0.22.x pins PyJWT[crypto]==2.13.0 and 0.23.0+ pins 2.15.1, so an exact pin here
    # made one shared plugin environment unsolvable and Hermes disabled the plugin at boot. The floor rises to
    # 2.15.1 when requires_hermes moves to >=0.23.0.
    "PyJWT[crypto]>=2.13.0,<3",
]
