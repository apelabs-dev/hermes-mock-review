name: Release Please

# Conventional commits on main drive the version. On every push to main this opens or updates a release PR that
# bumps plugin.yaml, mockreview/__init__.py, .release-please-manifest.json and CHANGELOG.md together; merging that
# PR tags vX.Y.Z and publishes the GitHub release. The pin to NousResearch/hermes-agent's catalog stays manual.
#
# One repository setting is required once: Settings > Actions > General > Workflow permissions must allow
# "Allow GitHub Actions to create and approve pull requests", so the action's own pull requests can be opened.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
