name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly on main: the full matrix again, so a browser failure that no longer blocks a pull request on macOS or
  # Windows (see the browser tier rows below) still turns into an issue, and from there a card (nightly-report).
  schedule:
    - cron: "23 11 * * *"

permissions:
  contents: read

concurrency:
  # The nightly run has its own group, so it never replaces a pending push run on main (or the reverse).
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Hermes release the plugin is validated against (tag v0.22.0, the requires_hermes floor).
  HERMES_REF: e06df9c2eae6901f4c88f464e0ae6e753c0428b8

jobs:
  tests:
    name: ${{ matrix.check }} (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The job cap, not a per-test timeout: the suite grew to ~2,150 tests and macOS/Windows need about 25 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Linux covers the oldest and newest Python Hermes allows; macOS and Windows run what the Hermes installer installs.
        # The four "tests (...)" rows are required checks. On macOS and Windows the browser tier is its own row,
        # "browser tier (...)", which is not required, starts at the same time as the required row, and on a pull
        # request ends green even when its tests fail: the failure is a warning on the check and in the job summary.
        # On main (push and the nightly run) it fails like any other job. The Linux rows run both tiers, so a browser
        # regression still blocks every pull request there.
        include:
          - check: tests
            os: ubuntu-latest
            python: "3.11"
            part: both
          - check: tests
            os: ubuntu-latest
            python: "3.14"
            part: both
          - check: tests
            os: macos-latest
            python: "3.14"
            part: nonbrowser
          - check: tests
            os: windows-latest
            python: "3.14"
            part: nonbrowser
          - check: browser tier
            os: macos-latest
            python: "3.14"
            part: browser
          - check: browser tier
            os: windows-latest
            python: "3.14"
            part: browser
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
          enable-cache: false

      # A Release Please pull request only rewrites the five files the action owns, so the six tests jobs still run
      # (four of their names are required checks) but the heavy tiers can be skipped inside them. No fetch happens on a
      # push or a manual run, and a failed fetch or script leaves tests=run: the fallback is always the full matrix.
      # Only a release-please branch takes this path; any other pull request, even one that only edits plugin.yaml, runs
      # every tier (the scope step is skipped, its empty output is not 'skip').
      - name: Scope the test tiers
        id: scope
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "tests=run" >> "$GITHUB_OUTPUT"
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            scope="$("$py" scripts/version_only.py --base "$BASE_SHA" || true)"
            scope="${scope%$'\r'}"
            if [ "$scope" = "version-only" ]; then
              echo "tests=skip" >> "$GITHUB_OUTPUT"
            fi
          fi

      # The suite is split into its two bounded halves so each has its own log artifact: a red fast tier no longer
      # hides which browser module failed, and the browser tier still runs after it (if: always()) so one job shows
      # every failure. `--part` is exactly the old `full` plan, halved; --all still shows every failure. The logs are
      # written to runner.temp (present on all three OSes) and uploaded with if: always(), green or red.
      - name: Run the non-browser tier
        if: ${{ !cancelled() && steps.scope.outputs.tests != 'skip' && matrix.part != 'browser' }}
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs/nonbrowser
        run: >-
          uv run --no-project --managed-python --python "${{ matrix.python }}"
          --with-requirements requirements-dev.txt
          python scripts/check.py full --part nonbrowser --all

      - name: Upload the non-browser logs
        if: ${{ always() && matrix.part != 'browser' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/check-logs/nonbrowser
          name: check-logs-${{ matrix.os }}-py${{ matrix.python }}-nonbrowser
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      # check.py retries a failed browser module's failed tests once; a test that passes then is reported as flaky (a
      # warning and a job-summary line) and does not fail the step.
      - name: Run the browser tier
        id: browser
        if: ${{ !cancelled() && steps.scope.outputs.tests != 'skip' && matrix.part != 'nonbrowser' }}
        continue-on-error: ${{ matrix.part == 'browser' && github.event_name == 'pull_request' }}
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs/browser
        run: >-
          uv run --no-project --managed-python --python "${{ matrix.python }}"
          --with-requirements requirements-dev.txt
          python scripts/check.py full --part browser --all

      - name: Report the non-blocking browser failure
        if: ${{ steps.browser.outcome == 'failure' && steps.browser.conclusion == 'success' }}
        env:
          OS: ${{ matrix.os }}
          ARTIFACT: check-logs-${{ matrix.os }}-py${{ matrix.python }}-browser
        run: |
          msg="The browser tier failed on $OS even after the retry. It does not block this pull request; main's next push and the nightly run fail on it. Logs: the $ARTIFACT artifact."
          echo "::warning title=Browser tier failed (not blocking)::$msg"
          printf '### Browser tier failed (not blocking)\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the browser logs
        if: ${{ always() && matrix.part != 'nonbrowser' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/check-logs/browser
          name: check-logs-${{ matrix.os }}-py${{ matrix.python }}-browser
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  ui-css:
    name: committed CSS freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Development-only: the plugin runtime and install never need Node. This job makes a hand-edited or stale
      # committed mockreview/board/tw.css fail instead of shipping.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run check:css

  validate:
    name: hermes plugins validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hermes's own reusable gate: builds Hermes from source at hermes-ref under RUNNER_TEMP and runs
      # `plugins validate .` there. The plugin's one required dependency (itsdangerous, pyproject.toml) is
      # pure Python and is installed by Hermes's plugin installer when the plugin is enabled.
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@e06df9c2eae6901f4c88f464e0ae6e753c0428b8 # v0.22.0
        with:
          path: .
          hermes-ref: ${{ env.HERMES_REF }}

  sweep:
    name: identifier and secret sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the history is complete
        run: test "$(git rev-parse --is-shallow-repository)" = false

      # MOCKREVIEW_SWEEP_TOKENS (one private token per line) comes from the repository secret of the same
      # name. Private tokens are checked only after the commit recorded in scripts/sweep-baseline, so the
      # already-published history is not re-flagged, while the generic denylist still covers every commit.
      # Forks do not receive the secret; the script then runs the generic denylist only and says so. On non-fork
      # runs MOCKREVIEW_REQUIRE_TOKENS is true, so an empty token list exits 2 and prints on stderr `error:
      # MOCKREVIEW_REQUIRE_TOKENS is set but MOCKREVIEW_SWEEP_TOKENS is empty: the repository secret
      # MOCKREVIEW_SWEEP_TOKENS is not set, so no private tokens were checked`.
      - name: Sweep the tree
        env:
          MOCKREVIEW_SWEEP_TOKENS: ${{ secrets.MOCKREVIEW_SWEEP_TOKENS }}
          MOCKREVIEW_REQUIRE_TOKENS: ${{ github.event.pull_request.head.repo.fork != true }}
        run: python3 scripts/check_identifiers.py

      - name: Sweep the history
        env:
          MOCKREVIEW_SWEEP_TOKENS: ${{ secrets.MOCKREVIEW_SWEEP_TOKENS }}
          MOCKREVIEW_REQUIRE_TOKENS: ${{ github.event.pull_request.head.repo.fork != true }}
        run: python3 scripts/check_identifiers.py --history

  # A failed nightly run opens one issue labelled nightly-ci, or comments on the open one, so repeated failures stay one
  # thread. gh-kanban-sync mirrors the repository's issues onto the mock-review board, which makes it a card.
  nightly-report:
    name: nightly failure report
    needs: [tests, ui-css, validate, sweep]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          failed="$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')" || true
          body="$(printf 'The nightly CI run on main failed at %s.\n\nFailed jobs:\n%s\n\nRun: %s\n' "$SHA" "${failed:-(none listed)}" "$RUN_URL")"
          gh label create nightly-ci --color B60205 --description "The nightly CI run on main failed" --force
          open="$(gh issue list --label nightly-ci --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly CI failed on main" --label nightly-ci --body "$body"
          fi
