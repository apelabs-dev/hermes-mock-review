name: mock-review
version: 2.1.4  # x-release-please-version
requires_hermes: ">=0.22.0"
capabilities: []
requires_env:
  - name: MOCKREVIEW_WEBHOOK_SECRET
    optional: true
    secret: true
    description: "Leave empty: hermes mockreview setup generates and stores it."
description: "Review boards for UI mockups: nine mock_review tools, the mockreview CLI and slash command, the usage skill, a webhook platform connect handler for optional in-gateway autostart, and a stdio MCP server for other coding agents."
platforms: [webhook]
provides_hooks: []
kind: standalone
manifest_version: 2
api_version: 1
license: MIT
tags: [design, mockup, review, feedback]
provides_tools:
  - mock_review_create
  - mock_review_add_round
  - mock_review_feedback
  - mock_review_ack
  - mock_review_list
  - mock_review_patch_block
  - mock_review_list_comments
  - mock_review_reply
  - mock_review_resolve
config_schema:
  devices:
    type: list
    default: [desktop, mobile]
    description: "Device widths the board offers, any of desktop, tablet, mobile. With one device the switch is hidden. Env: MOCKREVIEW_DEVICES."
  default_device:
    type: str
    default: "auto"
    enum: ["auto", "desktop", "tablet", "mobile"]
    description: "Width the board opens at: auto (the viewer's device, clamped to devices), desktop, tablet or mobile. Env: MOCKREVIEW_DEFAULT_DEVICE."
  default_theme:
    type: str
    default: "project"
    enum: ["project", "dark", "light"]
    description: "Theme the board opens in: project (the design profile's default), dark or light. Env: MOCKREVIEW_DEFAULT_THEME."
  show_theme_toggle:
    type: bool
    default: true
    description: "Show the light/dark toggle in the header. Env: MOCKREVIEW_SHOW_THEME_TOGGLE."
  layout:
    type: str
    default: "inline"
    enum: ["inline", "cards"]
    description: "Board layout: inline (flowing document with thin rules, no card backgrounds) or cards (2.0.0 look with bordered/rounded sections). Env: MOCKREVIEW_LAYOUT."
  mobile_width:
    type: int
    default: 390
    description: "Mock width in px for Mobile. Env: MOCKREVIEW_MOBILE_WIDTH."
  tablet_width:
    type: int
    default: 820
    description: "Mock width in px for Tablet (capped at a decision's desktop_width). Env: MOCKREVIEW_TABLET_WIDTH."
  desktop_width:
    type: int
    default: 1280
    description: "Desktop mock width in px for a decision that sets no desktop_width. Env: MOCKREVIEW_DESKTOP_WIDTH."
  pins_enabled:
    type: bool
    default: true
    description: "Let the reviewer drop pins on mocks. Env: MOCKREVIEW_PINS_ENABLED."
  require_note_on_change:
    type: bool
    default: false
    description: "Block Send until every Change mark has a note. Env: MOCKREVIEW_REQUIRE_NOTE_ON_CHANGE."
  max_pins:
    type: int
    default: 40
    description: "Most pins per round. Env: MOCKREVIEW_MAX_PINS."
  footer_button:
    type: str
    default: "build"
    enum: ["send", "build"]
    description: "The one button in the footer of a round that has a gate (every plan board): build or send. build: Build, locked until nothing is open or on Change, with the reason in its tooltip; a block on Change turns it into Send for that round's notes. send: Send only, and the board never offers Build. A round with no gate always has Send. Env: MOCKREVIEW_FOOTER_BUTTON."
  interactive_elements:
    type: bool
    default: true
    description: "Mocks carry working controls. On: build every control in a mock so it responds (a dropdown opens, a switch flips, a tab changes, a field takes text); the comment toggle is always one press away (C). Off: mocks are static pictures. Env: MOCKREVIEW_INTERACTIVE_ELEMENTS."
  pin_fix:
    type: bool
    default: false
    description: "Let a reviewer ask Hermes to patch one block of the current round in place, from a pin or an @Hermes comment, instead of sending a new round. A review created through the tools turns this on when it wakes Hermes and off when it does not; an explicit value from the call, the environment or config wins, so a config-level true survives wake=false. Off: pins and comments are notes only. Env: MOCKREVIEW_PIN_FIX."
  pin_fix_window_seconds:
    type: float
    default: 20.0
    description: "Requests that arrive within this many seconds of each other share one wake-up. Env: MOCKREVIEW_PIN_FIX_WINDOW_SECONDS."
  pin_fix_min_seconds:
    type: float
    default: 60.0
    description: "Minimum seconds between two pin-fix wake-ups for one review. Env: MOCKREVIEW_PIN_FIX_MIN_SECONDS."
  pin_fix_max_per_hour:
    type: int
    default: 60
    description: "Most pin-fix requests one review accepts in a rolling hour. Env: MOCKREVIEW_PIN_FIX_MAX_PER_HOUR."
  pin_fix_max_per_round:
    type: int
    default: 60
    description: "Most pin-fix requests one round accepts. Env: MOCKREVIEW_PIN_FIX_MAX_PER_ROUND."
  webhook_url:
    type: str
    default: "http://localhost:8644/webhooks/mock-review"
    description: "Hermes webhook base URL; the route suffix is selected by origin platform. Env: MOCKREVIEW_WEBHOOK_URL."
  webhook_route:
    type: str
    default: "mock-review"
    description: "Webhook route prefix; setup creates <prefix>-<platform> for each origin platform. Env: MOCKREVIEW_WEBHOOK_ROUTE."
  wake_required:
    type: bool
    default: true
    description: "Refuse to create or extend a review unless the owning service can wake Hermes on Send (the scoped signing secret is set; setup creates routes). Off: demo/local-only boards that are viewed but never wake anyone. Env: MOCKREVIEW_WAKE_REQUIRED."
  retry_seconds:
    type: float
    default: 60.0
    description: "Seconds between retries of an undelivered wake-up. Env: MOCKREVIEW_RETRY_SECONDS."
  stale_after_minutes:
    type: float
    default: 15.0
    description: "Minutes after a submitted round with no new round before the board server pings the origin chat that the agent may have stalled. No ping for a round with nothing to build (every decision approved or skipped, every question on its recommendation, no pins, no general notes, Build not pressed) or one the agent acknowledged (mockreview ack). 0 = never ping. Env: MOCKREVIEW_STALE_AFTER_MINUTES."
  stale_after_read_minutes:
    type: float
    default: 60.0
    description: "Once the agent has read a submission's feedback (mock_review_feedback or mockreview feedback), minutes after that read with no new round before the stalled ping. 0 = no ping once the feedback was read. Env: MOCKREVIEW_STALE_AFTER_READ_MINUTES."
  build_stale_factor:
    type: float
    default: 4.0
    description: "A build takes longer than a feedback round: after Build, stale_after_minutes and stale_after_read_minutes are multiplied by this before the stalled ping, and the ping names the longer wait. 1 = the same wait as Send. A wait of 0 stays off. Env: MOCKREVIEW_BUILD_STALE_FACTOR."
  wake_toolsets:
    type: list
    default: []
    description: "Hermes toolsets the session woken by Send may use, for example mock-review, terminal, file (the list replaces Hermes's webhook default). hermes mockreview setup prints the toolsets line to add by hand to the wake route in webhook_subscriptions.json; add it again after every setup run. Empty: Hermes's safe webhook tools only, and the build continues in the origin chat's session. Refused for a waking board whose Send is ungated (any board while host listens beyond loopback), because that board text would reach these tools. Env: MOCKREVIEW_WAKE_TOOLSETS."
  default_host:
    type: str
    default: "local"
    enum: ["tailnet", "local", "public"]
    description: "Where a review is hosted when the call doesn't say: tailnet (private, over Tailscale), local (this computer's own address, no Tailscale) or public (an internet URL behind Tailscale Funnel or any TLS proxy). Env: MOCKREVIEW_DEFAULT_HOST."
  ask_host_each_time:
    type: bool
    default: true
    description: "Ask the user tailnet, local or public before every review (read by the skill and tool text, not enforced in code). Env: MOCKREVIEW_ASK_HOST_EACH_TIME."
  public_base:
    type: str
    default: ""
    description: "Tailnet URL for review links. Empty: detect MagicDNS with tailscale status --json. Env: MOCKREVIEW_PUBLIC_BASE."
  public_url:
    type: str
    default: ""
    description: "The public HTTPS URL a TLS proxy serves this board at (Caddy, nginx, Cloudflare Tunnel, oauth2-proxy). Empty: the Tailscale Funnel URL when Funnel serves the board, else public_base. Env: MOCKREVIEW_PUBLIC_URL."
  funnel_port:
    type: int
    default: 8443
    description: "HTTPS port `hermes mockreview public on` maps through Tailscale Funnel. Funnel allows only 443, 8443 and 10000; 443 is usually taken. Env: MOCKREVIEW_FUNNEL_PORT."
  host:
    type: str
    default: "127.0.0.1"
    enum: ["127.0.0.1", "localhost", "::1", "0.0.0.0"]
    description: "Address the board server binds. Loopback (default) keeps it on this computer (tailnet via tailscale serve); 0.0.0.0 shares it with every device on your network, unauthenticated, so local links open on other devices. Env: MOCKREVIEW_HOST."
  owner:
    type: str
    default: "auto"
    enum: ["auto", "service", "self"]
    description: "Who owns board storage and wake-ups: the running board server. auto = use this process's own store when the server watches it; inside a Kanban worker whose store is not watched, create in the server's store instead (reported in the result); anywhere else refuse rather than publish an orphan board. service = always the server's store. self = this process's store, no server check (own server, tests). Env: MOCKREVIEW_OWNER."
  port:
    type: int
    default: 8790
    description: "Port the board server binds. Env: MOCKREVIEW_PORT."
  local_base:
    type: str
    default: ""
    description: "URL the CLI uses to reach the server. Empty: http://<host>:<port>. Env: MOCKREVIEW_LOCAL_BASE."
  lan_address:
    type: str
    default: ""
    description: "Address local-mode links use. Empty: this computer's network address, detected (127.0.0.1 while the server binds loopback only). Env: MOCKREVIEW_LAN_ADDRESS."
  loopback_owner:
    type: bool
    default: true
    description: "A request from this computer that did not come through a proxy is the install's owner (an admin) with no sign-in. Off: everyone signs in, the owner with mockreview login. Env: MOCKREVIEW_LOOPBACK_OWNER."
  trusted_proxies:
    type: list
    default: ["127.0.0.1", "::1"]
    description: "Addresses or networks of the reverse proxies whose identity headers are read (tailscale serve, cloudflared and most local proxies connect from loopback). Identity headers from any other peer are ignored. Env: MOCKREVIEW_TRUSTED_PROXIES."
  tailscale_identity:
    type: bool
    default: true
    description: "Sign in a tailnet person whose Tailscale Serve identity (Tailscale-User-Login) is linked to an account. Read only from trusted_proxies, only when X-Forwarded-For is the single tailnet address Serve sets (100.64.0.0/10 or fd7a:115c:a1e0::/48), and never for a Funnel request, a public host, or a request that also carries another source's identity headers. Any other proxy in trusted_proxies must strip Tailscale-User-* headers, or turn this off. Env: MOCKREVIEW_TAILSCALE_IDENTITY."
  forwarded_identity:
    type: bool
    default: false
    description: "Sign in a person whose X-Forwarded-User / X-Forwarded-Email (oauth2-proxy, Authelia) is linked to an account. Read only from trusted_proxies; turn it on only when that proxy strips these headers from incoming requests. Refused on a public host and with the Funnel marker (Funnel and Serve connect from a trusted loopback proxy and strip only Tailscale-* headers). Env: MOCKREVIEW_FORWARDED_IDENTITY."
  cloudflare_team:
    type: str
    default: ""
    description: "Cloudflare Access team name (the <team> in <team>.cloudflareaccess.com). With cloudflare_audience set, the Cf-Access-Jwt-Assertion JWT signs in a linked account; needs the plugin's crypto extra (PyJWT with cryptography) or the server refuses to start. Env: MOCKREVIEW_CLOUDFLARE_TEAM."
  cloudflare_audience:
    type: str
    default: ""
    description: "The Cloudflare Access application's AUD tag; a JWT for any other audience is refused. Env: MOCKREVIEW_CLOUDFLARE_AUDIENCE."
  offer_live_demo:
    type: bool
    default: false
    description: "Allow a prototype (\"try it live\") round. Off: create/add-round refuse one unless the call allows it. Env: MOCKREVIEW_OFFER_LIVE_DEMO."
  data_dir:
    type: str
    default: ""
    description: "Where reviews live. Empty: $HERMES_HOME/workspace/mock-reviews. Env: MOCKREVIEW_HOME."
  auto_close_idle_days:
    type: int
    default: 0
    description: "Close an open review after this many days without a new round or feedback. 0 = never. Env: MOCKREVIEW_AUTO_CLOSE_IDLE_DAYS."
  keep_closed_days:
    type: int
    default: 0
    description: "Delete a closed review this many days after it closed. 0 = keep forever. Env: MOCKREVIEW_KEEP_CLOSED_DAYS."
  housekeeping_seconds:
    type: int
    default: 3600
    description: "Seconds between the server's auto-close/prune passes. Env: MOCKREVIEW_HOUSEKEEPING_SECONDS."
  sse_heartbeat_seconds:
    type: int
    default: 15
    description: "Seconds between heartbeat comments on a quiet server-sent-events stream, so proxies do not drop it. Env: MOCKREVIEW_SSE_HEARTBEAT_SECONDS."
  autostart:
    type: bool
    default: false
    description: "Start the board server inside the Hermes gateway process (a background thread serving host:port) when the gateway's webhook platform connects. Off (default): nothing runs in the background; run `hermes mockreview serve` yourself. Restart the gateway after changing it, host or port. Env: MOCKREVIEW_AUTOSTART."
  webhook_secret:
    type: secret
    env: MOCKREVIEW_WEBHOOK_SECRET
    required: false
    description: "Optional signing secret; required only for wake delivery."
